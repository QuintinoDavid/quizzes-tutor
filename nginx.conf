# Adapted from source/data/localhost-nginx.conf.example. Changes for atg:
# - listen on port 5181, which start.sh publishes on 127.0.0.1:5181, the url in app.json
# - logs go to the container output, not to files in /var/log/nginx
# /api/ goes to the container "backend" on port 8080, as upstream, because start.sh puts
# nginx and the backend on one Docker network.
worker_processes  1;
pid        /tmp/nginx.pid;

events {
  worker_connections  1024;
}

http {
  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout  65;
  charset UTF-8;

  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  access_log  off;
  error_log  /dev/stderr warn;

  server {
    listen 5181 default_server;
    server_name localhost;

    gzip on;
    gzip_types text/plain text/css application/json application/x-javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_proxied  any;
    gzip_vary on;

    client_max_body_size        128000000;

    location /api/ {
        proxy_pass  http://backend:8080/;
    }

    location / {
      root   /app;
      index  index.html;
      try_files $uri $uri/ /index.html;
    }
  }
}
